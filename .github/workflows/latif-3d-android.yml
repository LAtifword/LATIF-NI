name: LATIF 3D Standalone Android APK
on:
  push:
    branches: [latif-3d-android]
    paths:
      - 'latif-3d/**'
      - '.github/workflows/latif-3d-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check offline assets and JavaScript syntax
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re,subprocess
          assets=Path('latif-3d/app/src/main/assets')
          for name in ('index.html','3d.html'):
              html=(assets/name).read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
              assert scripts, f'No embedded script in {name}'
              for n,script in enumerate(scripts):
                  f=Path('/tmp')/f'{name}-{n}.js';f.write_text(script)
                  subprocess.run(['node','--check',str(f)],check=True)
          print('Offline HTML and JavaScript checks passed')
          PYCODE
      - name: Build standalone debug APK
        run: gradle -p latif-3d :app:assembleDebug --no-daemon --stacktrace
      - name: Inspect APK and Android signature
        run: |
          APK=latif-3d/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/3d.html'
          unzip -l "$APK" | grep -q 'assets/index.html'
          SDKTOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$SDKTOOLS" verify --verbose "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: LATIF-3D-STANDALONE-APK
          path: latif-3d/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
